apiVersion: v1
kind: Namespace
metadata:
  name: smash
---
apiVersion: v1
kind: Secret
metadata:
  name: smash-secret
  namespace: smash
type: Opaque
stringData:
  SB_API_TOKEN: "" # change me
  SB_API_SECRET: "" 
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smash-config
  namespace: smash
data:
  SQLITE_PATH: "/var/www/db/smash.sqlite"
  TZ: "Asia/Tokyo"

  # ここから下は.env.sample参考に変えてください
  DEFAULT_COLOR_MODE: "auto" # light, dark, auto(browser settings)
  AUTO_DARK_MODE: "true"
  DARK_START_HOUR: "18"
  DARK_END_HOUR: "6"

  JMA_AREA_CODE: "270000"

  USE_SB_TEMPERATURE: "true"
  SB_TEMPERATURE_ID: ""

  USE_SB_LOCK: "true"
  SB_LOCK_ID: ""

  USE_SB_LIGHT: "true"
  SB_LIGHT_ID: ""

  USE_SB_AC: "true"
  SB_AC_ID: ""
  SB_AC_OFF_TWICE_RUN: "false"  
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smash-sqlite-pvc
  namespace: smash
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smash-php
  namespace: smash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smash-php
  template:
    metadata:
      labels:
        app: smash-php
    spec:
      containers:
        - name: smash-php
          image: ogatomo21/smash:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: smash-config
            - secretRef:
                name: smash-secret
          volumeMounts:
            - name: smash-sqlite
              mountPath: /var/www/db
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: smash-sqlite
          persistentVolumeClaim:
            claimName: smash-sqlite-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: smash-php
  namespace: smash
spec:
  type: ClusterIP # 外部で使いたかったらNodePortとかにしてね
  selector:
    app: smash-php
  ports:
    - port: 80
      targetPort: 80
      nodePort: 33000 # 各自で変更
